apiVersion: v1
kind: Namespace
metadata:
  name: dvillarroel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: curso-devops-lab3-config
  namespace: dvillarroel
data:
  USER_KEY: "dvillarroel"
  ENDPOINT: "https://api.google.com/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: curso-devops-lab3-secret
  namespace: dvillarroel
type: Opaque
stringData:
  BD_PASSWORD: "YXBpa2V5MTIzNDU2"
---  
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curso-devops-lab3-deployment
  namespace: dvillarroel
  labels:
    app: curso-devops-lab3-stack
spec:
  replicas: 3
  selector:
    matchLabels:
      app: curso-devops-lab3-stack
  template:
    metadata:
      labels:
        app: curso-devops-lab3-stack
    spec:
      containers:
      - name: contenedor-curso-devops-lab3
        image: ghcr.io/abelkmai1/curso-devops-lab3:latest
        imagePullPolicy: Always
        env:
        - name: NODE_ENV
          value: development
        - name: PORT
          value: "3000"
        - name: USER_KEY
          valueFrom:
            configMapKeyRef:
              name: curso-devops-lab3-config
              key: USER_KEY
              optional: true
        - name: BD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: curso-devops-lab3-secret
              key: BD_PASSWORD
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: curso-devops-lab3-service
  namespace: dvillarroel
  labels:
    app: curso-devops-lab3-stack
spec:
  selector:
    app: curso-devops-lab3-stack
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
        
              
    

